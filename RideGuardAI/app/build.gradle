plugins {
    id 'com.android.application'
}

// If app/google-services.json exists, the app connects to your real Firebase project.
// If it does not exist, the app builds in DEMO MODE with sample data.
def hasFirebaseConfig = file('google-services.json').exists()
if (hasFirebaseConfig) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.rideguard.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.rideguard.ai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "boolean", "DEMO_MODE", hasFirebaseConfig ? "false" : "true"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
}
